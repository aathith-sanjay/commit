spring.application.name=commit-backend

# DB_URL takes priority (local dev with docker-compose).
# On Render, DB_HOST/DB_PORT/DB_NAME are injected from the managed database.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:commit}}
spring.datasource.username=${DB_USERNAME:commit}
spring.datasource.password=${DB_PASSWORD:commit}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:commit-default-dev-secret-key-please-change-in-production-1234567890}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:30}

# CORS: set CORS_ALLOWED_ORIGINS to your GitHub Pages origin in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
